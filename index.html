<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aşkım 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(160deg, #ffcce0, #ff9ec8);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background 1.5s ease;
    }

    body.dark {
      background: #0c0914;
    }

    /* ========== FIRST SCREEN ========== */
    .container {
      text-align: center;
      z-index: 10;
      transition: all 0.9s ease;
    }

    .container.hide {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
    }

    .bear {
      width: 145px;
      height: 145px;
      margin: 0 auto 16px;
      background: #fff;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 82px;
      box-shadow: 0 15px 40px rgba(173, 20, 87, 0.18);
      animation: softBounce 3s ease-in-out infinite;
    }

    @keyframes softBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      font-size: 1.5rem;
      color: #c2185b;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      position: relative;
      height: 52px;
    }

    button {
      border: none;
      padding: 13px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
    }

    #yesBtn {
      background: linear-gradient(135deg, #66bb6a, #2e7d32);
      color: white;
      box-shadow: 0 8px 22px rgba(46, 125, 50, 0.45);
    }

    #yesBtn:active {
      transform: scale(0.93);
    }

    #noBtn {
      background: linear-gradient(135deg, #ef5350, #c62828);
      color: white;
      position: absolute;
      box-shadow: 0 8px 22px rgba(198, 40, 40, 0.45);
      transition: left 0.2s ease, top 0.2s ease;
    }

    /* ========== LILY REVEAL ========== */
    .lily-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease;
      z-index: 20;
    }

    .lily-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Glass */
    .glass {
      width: 240px;
      height: 340px;
      background: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.02));
      border: 2px solid rgba(255, 150, 200, 0.3);
      border-radius: 120px 120px 22px 22px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 35px;
      box-shadow: 
        0 0 80px rgba(255, 105, 180, 0.35),
        inset 0 0 50px rgba(255,255,255,0.06);
      overflow: hidden;
    }

    /* ===== REAL LILY ===== */
    .lily {
      position: relative;
      width: 160px;
      height: 200px;
      transform-origin: 50% 90%;
      animation: bloomIn 2.4s cubic-bezier(0.22, 1.2, 0.36, 1) forwards,
                 gentleSway 5s ease-in-out 2.5s infinite;
    }

    @keyframes bloomIn {
      0% {
        transform: scale(0.15) rotate(-20deg);
        opacity: 0;
      }
      60% {
        transform: scale(1.08) rotate(5deg);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes gentleSway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    /* Petals - more realistic shape */
    .petal {
      position: absolute;
      width: 48px;
      height: 110px;
      background: linear-gradient(
        to top,
        #ff2d7a 0%,
        #ff6ba8 35%,
        #ffb0d0 70%,
        #ffe0ee 100%
      );
      border-radius: 50% 50% 35% 35%;
      top: 10px;
      left: 56px;
      transform-origin: 50% 95%;
      box-shadow: 0 0 18px rgba(255, 45, 122, 0.45);
    }

    /* Outer petals */
    .petal:nth-child(1) { transform: rotate(0deg)   scale(1.05); z-index: 6; }
    .petal:nth-child(2) { transform: rotate(60deg)  scale(1.02); z-index: 5; }
    .petal:nth-child(3) { transform: rotate(120deg) scale(1.02); z-index: 4; }
    .petal:nth-child(4) { transform: rotate(180deg) scale(1.05); z-index: 5; }
    .petal:nth-child(5) { transform: rotate(240deg) scale(1.02); z-index: 4; }
    .petal:nth-child(6) { transform: rotate(300deg) scale(1.02); z-index: 5; }

    /* Inner smaller petals for depth */
    .petal.inner {
      width: 36px;
      height: 85px;
      top: 22px;
      left: 62px;
      background: linear-gradient(to top, #ff4d8d, #ff8fbc, #ffd0e4);
      opacity: 0.95;
    }

    .petal.inner:nth-child(7)  { transform: rotate(30deg);  z-index: 7; }
    .petal.inner:nth-child(8)  { transform: rotate(90deg);  z-index: 7; }
    .petal.inner:nth-child(9)  { transform: rotate(150deg); z-index: 7; }
    .petal.inner:nth-child(10) { transform: rotate(210deg); z-index: 7; }
    .petal.inner:nth-child(11) { transform: rotate(270deg); z-index: 7; }
    .petal.inner:nth-child(12) { transform: rotate(330deg); z-index: 7; }

    /* Center */
    .center {
      position: absolute;
      width: 26px;
      height: 26px;
      background: radial-gradient(circle at 30% 30%, #fff9c4, #ffca28, #ff8f00);
      border-radius: 50%;
      top: 48px;
      left: 67px;
      z-index: 20;
      box-shadow: 0 0 16px rgba(255, 202, 40, 0.9);
      animation: centerPulse 2.2s ease-in-out infinite;
    }

    @keyframes centerPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 16px rgba(255, 202, 40, 0.9); }
      50% { transform: scale(1.2); box-shadow: 0 0 28px rgba(255, 202, 40, 1); }
    }

    /* Stem */
    .stem {
      position: absolute;
      bottom: -5px;
      left: 50%;
      width: 9px;
      height: 85px;
      background: linear-gradient(to bottom, #81c784, #2e7d32);
      border-radius: 5px;
      transform: translateX(-50%);
      z-index: 1;
    }

    /* Leaves */
    .leaf {
      position: absolute;
      width: 55px;
      height: 22px;
      background: linear-gradient(135deg, #a5d6a7, #388e3c);
      border-radius: 0 60% 0 60%;
      bottom: 40px;
      z-index: 2;
    }

    .leaf.left {
      left: 18px;
      transform: rotate(-40deg);
    }

    .leaf.right {
      right: 18px;
      transform: rotate(40deg) scaleX(-1);
    }

    /* Falling petals & sparkles */
    .fall {
      position: absolute;
      font-size: 18px;
      animation: fallDown 4.5s linear infinite;
      opacity: 0;
    }

    @keyframes fallDown {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      15% { opacity: 0.9; }
      100% { transform: translateY(380px) rotate(400deg); opacity: 0; }
    }

    /* Message */
    .message {
      margin-top: 32px;
      color: #ffb6d5;
      font-size: 1.3rem;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      animation: messageIn 1.5s 2s forwards;
      text-shadow: 0 0 25px rgba(255, 182, 213, 0.6);
      line-height: 1.5;
      padding: 0 20px;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Background hearts */
    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .bg-heart {
      position: absolute;
      font-size: 16px;
      animation: rise 7s linear infinite;
      opacity: 0;
    }

    @keyframes rise {
      0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
      10% { opacity: 0.7; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- First screen -->
  <div class="container" id="content">
    <div class="bear">🐻</div>
    <h1>Lilyum ister misin aşkım?</h1>
    <div class="buttons">
      <button id="yesBtn">Evet 💕</button>
      <button id="noBtn">Hayır</button>
    </div>
  </div>

  <!-- Lily reveal -->
  <div class="lily-screen" id="lilyScreen">
    <div class="glass">
      <div class="lily">
        <!-- Outer petals -->
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <!-- Inner petals -->
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>

        <div class="center"></div>
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>

      <!-- Falling particles -->
      <div class="fall" style="left:15%; animation-delay:0.3s">🌸</div>
      <div class="fall" style="left:35%; animation-delay:1.1s">✨</div>
      <div class="fall" style="left:55%; animation-delay:0.7s">🌸</div>
      <div class="fall" style="left:75%; animation-delay:1.8s">💕</div>
      <div class="fall" style="left:25%; animation-delay:2.4s">✨</div>
      <div class="fall" style="left:65%; animation-delay:3.0s">🌸</div>
    </div>

    <div class="message">
      Sen benim en güzel<br>pembe lilyumumsun 💕
    </div>
  </div>

  <!-- Background floating hearts -->
  <div class="bg-hearts" id="bgHearts"></div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const content = document.getElementById('content');
    const lilyScreen = document.getElementById('lilyScreen');
    const body = document.body;
    const bgHearts = document.getElementById('bgHearts');

    // Floating hearts
    for (let i = 0; i < 14; i++) {
      const h = document.createElement('div');
      h.className = 'bg-heart';
      h.innerHTML = '💕';
      h.style.left = Math.random() * 100 + '%';
      h.style.animationDelay = (Math.random() * 7) + 's';
      h.style.fontSize = (13 + Math.random() * 14) + 'px';
      bgHearts.appendChild(h);
    }

    // Runaway "Hayır"
    function moveNo() {
      const x = Math.random() * (window.innerWidth - 130);
      const y = Math.random() * (window.innerHeight - 70);
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.position = 'fixed';
    }

    noBtn.addEventListener('mouseover', moveNo);
    noBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      moveNo();
    });

    // Yes → show lily
    yesBtn.addEventListener('click', () => {
      content.classList.add('hide');
      body.classList.add('dark');
      setTimeout(() => {
        lilyScreen.classList.add('visible');
      }, 550);
    });

    window.addEventListener('resize', () => {
      if (noBtn.style.position === 'fixed') moveNo();
    });
  </script>
</body>
</html>
