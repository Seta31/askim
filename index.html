<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aşkım 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(160deg, #ffd0e4, #ff9ec8);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background 1.5s ease;
    }

    body.dark {
      background: #0d0a14;
    }

    /* First screen */
    .container {
      text-align: center;
      z-index: 10;
      transition: all 0.9s ease;
    }

    .container.hide {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
    }

    .bear {
      width: 140px;
      height: 140px;
      margin: 0 auto 18px;
      background: white;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      box-shadow: 0 12px 35px rgba(173, 20, 87, 0.18);
      animation: bounce 3s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 1.45rem;
      color: #ad1457;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      position: relative;
      height: 52px;
    }

    button {
      border: none;
      padding: 13px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
    }

    #yesBtn {
      background: linear-gradient(135deg, #66bb6a, #2e7d32);
      color: white;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.4);
    }

    #yesBtn:active {
      transform: scale(0.94);
    }

    #noBtn {
      background: linear-gradient(135deg, #ef5350, #c62828);
      color: white;
      position: absolute;
      box-shadow: 0 8px 20px rgba(198, 40, 40, 0.4);
      transition: left 0.2s ease, top 0.2s ease;
    }

    /* Reveal screen */
    .reveal {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.3s ease;
      z-index: 20;
      padding: 20px;
    }

    .reveal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .flower-img {
      width: 85%;
      max-width: 340px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      animation: appear 1.4s cubic-bezier(0.22, 1.2, 0.36, 1) forwards;
    }

    @keyframes appear {
      0% { transform: scale(0.6) translateY(40px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .message {
      margin-top: 28px;
      color: #ffb6d5;
      font-size: 1.35rem;
      font-weight: 500;
      text-align: center;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 1.5s 0.8s forwards;
      text-shadow: 0 0 25px rgba(255, 182, 213, 0.6);
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      animation: float 7s linear infinite;
      opacity: 0;
    }

    @keyframes float {
      0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
      15% { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container" id="content">
    <div class="bear">🐻</div>
    <h1>Çiçek ister misin aşkım?</h1>
    <div class="buttons">
      <button id="yesBtn">Evet 💕</button>
      <button id="noBtn">Hayır</button>
    </div>
  </div>

  <div class="reveal" id="reveal">
    <!-- Beautiful flower image -->
    <img class="flower-img" 
         src="https://images.unsplash.com/photo-1490750967868-88aa6486c934?w=600&q=80" 
         alt="Pembe çiçek">
    
    <div class="message">
      Sen benim en güzel<br>
      pembe çiçeğimsin 💕
    </div>
  </div>

  <div class="hearts" id="hearts"></div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const content = document.getElementById('content');
    const reveal = document.getElementById('reveal');
    const body = document.body;
    const hearts = document.getElementById('hearts');

    // Floating hearts
    for (let i = 0; i < 12; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.innerHTML = '💕';
      h.style.left = Math.random() * 100 + '%';
      h.style.animationDelay = Math.random() * 7 + 's';
      h.style.fontSize = (14 + Math.random() * 14) + 'px';
      hearts.appendChild(h);
    }

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 140);
      const y = Math.random() * (window.innerHeight - 80);
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.position = 'fixed';
    }

    noBtn.addEventListener('mouseover', moveNo);
    noBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      moveNo();
    });

    yesBtn.addEventListener('click', () => {
      content.classList.add('hide');
      body.classList.add('dark');
      setTimeout(() => {
        reveal.classList.add('visible');
      }, 500);
    });

    window.addEventListener('resize', () => {
      if (noBtn.style.position === 'fixed') moveNo();
    });
  </script>
</body>
</html>
