<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aşkım 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(160deg, #ffd0e4, #ff9ec8);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background 1.6s ease;
    }

    body.dark {
      background: #0b0812;
    }

    /* ===== FIRST SCREEN ===== */
    .container {
      text-align: center;
      z-index: 10;
      transition: all 1s ease;
    }

    .container.hide {
      opacity: 0;
      transform: scale(0.75);
      pointer-events: none;
    }

    .bear {
      width: 140px;
      height: 140px;
      margin: 0 auto 18px;
      background: #fff;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      box-shadow: 0 14px 40px rgba(173, 20, 87, 0.2);
      animation: bounce 3s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-11px); }
    }

    h1 {
      font-size: 1.45rem;
      color: #ad1457;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      position: relative;
      height: 52px;
    }

    button {
      border: none;
      padding: 13px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
    }

    #yesBtn {
      background: linear-gradient(135deg, #66bb6a, #2e7d32);
      color: white;
      box-shadow: 0 8px 22px rgba(46, 125, 50, 0.4);
    }

    #yesBtn:active { transform: scale(0.93); }

    #noBtn {
      background: linear-gradient(135deg, #ef5350, #c62828);
      color: white;
      position: absolute;
      box-shadow: 0 8px 22px rgba(198, 40, 40, 0.4);
      transition: left 0.2s ease, top 0.2s ease;
    }

    /* ===== REALISTIC LILY ===== */
    .lily-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
      z-index: 20;
    }

    .lily-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .glass {
      width: 250px;
      height: 360px;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02));
      border: 2px solid rgba(255, 160, 200, 0.28);
      border-radius: 125px 125px 24px 24px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 40px;
      box-shadow: 
        0 0 90px rgba(255, 105, 180, 0.4),
        inset 0 0 60px rgba(255,255,255,0.05);
      overflow: hidden;
    }

    .lily {
      position: relative;
      width: 170px;
      height: 220px;
      transform-origin: 50% 92%;
      animation: bloom 2.6s cubic-bezier(0.22, 1.3, 0.36, 1) forwards,
                 sway 5.5s ease-in-out 2.7s infinite;
    }

    @keyframes bloom {
      0% { transform: scale(0.1) rotate(-25deg); opacity: 0; }
      70% { transform: scale(1.08) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3.5deg); }
      50% { transform: rotate(3.5deg); }
    }

    /* Realistic petals */
    .petal {
      position: absolute;
      width: 52px;
      height: 120px;
      background: linear-gradient(
        to top,
        #e91e63 0%,
        #f06292 25%,
        #f8bbd0 55%,
        #fce4ec 100%
      );
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      top: 5px;
      left: 59px;
      transform-origin: 50% 98%;
      box-shadow: 
        0 0 20px rgba(233, 30, 99, 0.45),
        inset -8px -5px 15px rgba(0,0,0,0.08);
    }

    /* Outer layer */
    .petal:nth-child(1) { transform: rotate(0deg)   scale(1.08); z-index: 5; }
    .petal:nth-child(2) { transform: rotate(51deg)  scale(1.05); z-index: 4; }
    .petal:nth-child(3) { transform: rotate(102deg) scale(1.05); z-index: 3; }
    .petal:nth-child(4) { transform: rotate(153deg) scale(1.08); z-index: 4; }
    .petal:nth-child(5) { transform: rotate(204deg) scale(1.05); z-index: 3; }
    .petal:nth-child(6) { transform: rotate(255deg) scale(1.05); z-index: 4; }
    .petal:nth-child(7) { transform: rotate(306deg) scale(1.05); z-index: 3; }

    /* Inner petals for realism */
    .petal.inner {
      width: 38px;
      height: 95px;
      top: 18px;
      left: 66px;
      background: linear-gradient(to top, #ec407a, #f48fb1, #fce4ec);
      box-shadow: 0 0 12px rgba(236, 64, 122, 0.4);
    }

    .petal.inner:nth-child(8)  { transform: rotate(25deg);  z-index: 8; }
    .petal.inner:nth-child(9)  { transform: rotate(77deg);  z-index: 8; }
    .petal.inner:nth-child(10) { transform: rotate(128deg); z-index: 8; }
    .petal.inner:nth-child(11) { transform: rotate(180deg); z-index: 8; }
    .petal.inner:nth-child(12) { transform: rotate(231deg); z-index: 8; }
    .petal.inner:nth-child(13) { transform: rotate(282deg); z-index: 8; }
    .petal.inner:nth-child(14) { transform: rotate(334deg); z-index: 8; }

    /* Center */
    .center {
      position: absolute;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle at 35% 35%, #fff8e1, #ffca28, #ff8f00);
      border-radius: 50%;
      top: 42px;
      left: 71px;
      z-index: 20;
      box-shadow: 0 0 20px rgba(255, 202, 40, 0.95);
      animation: glow 2.4s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 202, 40, 0.95); }
      50% { transform: scale(1.18); box-shadow: 0 0 32px rgba(255, 202, 40, 1); }
    }

    /* Stem */
    .stem {
      position: absolute;
      bottom: -8px;
      left: 50%;
      width: 10px;
      height: 95px;
      background: linear-gradient(to bottom, #81c784, #2e7d32, #1b5e20);
      border-radius: 6px;
      transform: translateX(-50%);
      z-index: 1;
      box-shadow: inset -3px 0 6px rgba(0,0,0,0.15);
    }

    /* Leaves */
    .leaf {
      position: absolute;
      width: 58px;
      height: 24px;
      background: linear-gradient(135deg, #a5d6a7, #388e3c);
      border-radius: 0 70% 0 70%;
      bottom: 45px;
      z-index: 2;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    .leaf.left {
      left: 22px;
      transform: rotate(-38deg);
    }

    .leaf.right {
      right: 22px;
      transform: rotate(38deg) scaleX(-1);
    }

    /* Particles */
    .particle {
      position: absolute;
      font-size: 17px;
      animation: fall 5s linear infinite;
      opacity: 0;
    }

    @keyframes fall {
      0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
      12% { opacity: 0.9; }
      100% { transform: translateY(400px) rotate(480deg); opacity: 0; }
    }

    /* Message */
    .message {
      margin-top: 30px;
      color: #ffb6d5;
      font-size: 1.35rem;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1.6s 2.1s forwards;
      text-shadow: 0 0 30px rgba(255, 182, 213, 0.7);
      line-height: 1.55;
      padding: 0 25px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Background hearts */
    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .bg-heart {
      position: absolute;
      animation: rise 8s linear infinite;
      opacity: 0;
    }

    @keyframes rise {
      0% { transform: translateY(110vh) scale(0.4); opacity: 0; }
      10% { opacity: 0.65; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-15vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container" id="content">
    <div class="bear">🐻</div>
    <h1>Çiçek ister misin aşkım?</h1>
    <div class="buttons">
      <button id="yesBtn">Evet 💕</button>
      <button id="noBtn">Hayır</button>
    </div>
  </div>

  <div class="lily-screen" id="lilyScreen">
    <div class="glass">
      <div class="lily">
        <!-- Outer petals -->
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <!-- Inner petals -->
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>
        <div class="petal inner"></div>

        <div class="center"></div>
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>
      </div>

      <div class="particle" style="left:12%; animation-delay:0.4s">🌸</div>
      <div class="particle" style="left:30%; animation-delay:1.2s">✨</div>
      <div class="particle" style="left:52%; animation-delay:0.8s">🌸</div>
      <div class="particle" style="left:70%; animation-delay:1.9s">💕</div>
      <div class="particle" style="left:22%; animation-delay:2.6s">✨</div>
      <div class="particle" style="left:62%; animation-delay:3.3s">🌸</div>
    </div>

    <div class="message">
      Sen benim en güzel<br>
      pembe çiçeğimsin 💕
    </div>
  </div>

  <div class="bg-hearts" id="bgHearts"></div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const content = document.getElementById('content');
    const lilyScreen = document.getElementById('lilyScreen');
    const body = document.body;
    const bgHearts = document.getElementById('bgHearts');

    for (let i = 0; i < 15; i++) {
      const h = document.createElement('div');
      h.className = 'bg-heart';
      h.innerHTML = '💕';
      h.style.left = Math.random() * 100 + '%';
      h.style.animationDelay = (Math.random() * 8) + 's';
      h.style.fontSize = (12 + Math.random() * 16) + 'px';
      bgHearts.appendChild(h);
    }

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 140);
      const y = Math.random() * (window.innerHeight - 80);
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.position = 'fixed';
    }

    noBtn.addEventListener('mouseover', moveNo);
    noBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      moveNo();
    });

    yesBtn.addEventListener('click', () => {
      content.classList.add('hide');
      body.classList.add('dark');
      setTimeout(() => lilyScreen.classList.add('visible'), 600);
    });

    window.addEventListener('resize', () => {
      if (noBtn.style.position === 'fixed') moveNo();
    });
  </script>
</body>
</html>
