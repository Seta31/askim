<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aşkım 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffd6e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background 1.2s ease;
    }

    body.dark {
      background: #0f0c1a;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 10;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .container.hide {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }

    .bear {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      background: #fff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      font-size: 90px;
    }

    h1 {
      font-size: 1.6rem;
      color: #ad1457;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      position: relative;
      height: 55px;
    }

    button {
      border: none;
      padding: 14px 32px;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #yesBtn {
      background: #4caf50;
      color: white;
      box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
    }

    #yesBtn:active {
      transform: scale(0.95);
    }

    #noBtn {
      background: #f44336;
      color: white;
      position: absolute;
      box-shadow: 0 6px 15px rgba(244, 67, 54, 0.4);
      transition: left 0.25s ease, top 0.25s ease;
    }

    /* Rose in glass */
    .rose-container {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      z-index: 20;
    }

    .rose-container.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .glass {
      width: 220px;
      height: 320px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 110px 110px 20px 20px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 30px;
      box-shadow: 
        0 0 40px rgba(255, 100, 150, 0.3),
        inset 0 0 30px rgba(255,255,255,0.05);
    }

    .rose {
      font-size: 110px;
      filter: drop-shadow(0 0 20px rgba(255, 80, 140, 0.8));
      animation: float 3s ease-in-out infinite;
    }

    .petals {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 18px;
      opacity: 0.7;
    }

    .message {
      position: absolute;
      bottom: 60px;
      left: 0;
      right: 0;
      text-align: center;
      color: #ffb6d5;
      font-size: 1.3rem;
      font-weight: 500;
      opacity: 0;
      animation: fadeIn 1.5s 1s forwards;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ff9ec8;
      border-radius: 50%;
      animation: sparkle 2s infinite;
    }

    @keyframes sparkle {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0); }
    }
  </style>
</head>
<body>

  <div class="container" id="content">
    <div class="bear">🐻‍❄️</div>
    <h1>Çiçek ister misin?</h1>
    <div class="buttons">
      <button id="yesBtn">Evet 💕</button>
      <button id="noBtn">Hayır</button>
    </div>
  </div>

  <div class="rose-container" id="roseContainer">
    <div class="glass">
      <div class="rose">🌹</div>
      <div class="petals">🌸 🌸 🌸</div>
      <div class="sparkle" style="top:30%; left:20%; animation-delay:0s"></div>
      <div class="sparkle" style="top:45%; left:75%; animation-delay:0.6s"></div>
      <div class="sparkle" style="top:60%; left:30%; animation-delay:1.2s"></div>
      <div class="sparkle" style="top:25%; left:65%; animation-delay:0.3s"></div>
    </div>
    <div class="message">Seni çok seviyorum 💕</div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const content = document.getElementById('content');
    const roseContainer = document.getElementById('roseContainer');
    const body = document.body;

    // Make "Hayır" button run away
    function moveNoBtn() {
      const maxX = window.innerWidth - 120;
      const maxY = window.innerHeight - 60;
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.position = 'fixed';
    }

    noBtn.addEventListener('mouseover', moveNoBtn);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoBtn();
    });

    // When Yes is clicked
    yesBtn.addEventListener('click', () => {
      content.classList.add('hide');
      body.classList.add('dark');
      setTimeout(() => {
        roseContainer.classList.add('visible');
      }, 400);
    });

    // Keep No button inside screen on resize
    window.addEventListener('resize', () => {
      if (noBtn.style.position === 'fixed') {
        moveNoBtn();
      }
    });
  </script>
</body>
</html>
