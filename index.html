<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aşkım 💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(160deg, #ffd0e4, #ff9ec8);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background 1.6s ease;
    }

    body.dark {
      background: #0a0812;
    }

    /* ===== FIRST SCREEN ===== */
    .container {
      text-align: center;
      z-index: 10;
      transition: all 1s ease;
    }

    .container.hide {
      opacity: 0;
      transform: scale(0.75);
      pointer-events: none;
    }

    .bear {
      width: 140px;
      height: 140px;
      margin: 0 auto 18px;
      background: white;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      box-shadow: 0 12px 35px rgba(173, 20, 87, 0.2);
      animation: bounce 3s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      font-size: 1.45rem;
      color: #ad1457;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      position: relative;
      height: 52px;
    }

    button {
      border: none;
      padding: 13px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
    }

    #yesBtn {
      background: linear-gradient(135deg, #66bb6a, #2e7d32);
      color: white;
      box-shadow: 0 8px 22px rgba(46, 125, 50, 0.45);
    }

    #yesBtn:active {
      transform: scale(0.93);
    }

    #noBtn {
      background: linear-gradient(135deg, #ef5350, #c62828);
      color: white;
      position: absolute;
      box-shadow: 0 8px 22px rgba(198, 40, 40, 0.45);
      transition: left 0.2s ease, top 0.2s ease;
    }

    /* ===== REVEAL SCREEN ===== */
    .reveal {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease;
      z-index: 20;
      padding: 20px;
    }

    .reveal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Flower image with many animations */
    .flower-wrapper {
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .flower-img {
      width: 85%;
      max-width: 340px;
      border-radius: 20px;
      box-shadow: 
        0 0 40px rgba(255, 150, 200, 0.4),
        0 25px 50px rgba(0,0,0,0.5);
      animation: 
        appear 1.6s cubic-bezier(0.22, 1.3, 0.36, 1) forwards,
        glowPulse 3s ease-in-out 1.6s infinite,
        softRotate 8s ease-in-out 1.6s infinite;
    }

    @keyframes appear {
      0% {
        transform: scale(0.3) rotate(-15deg);
        opacity: 0;
        filter: blur(10px);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes glowPulse {
      0%, 100% {
        box-shadow: 
          0 0 30px rgba(255, 150, 200, 0.3),
          0 25px 50px rgba(0,0,0,0.5);
      }
      50% {
        box-shadow: 
          0 0 60px rgba(255, 120, 180, 0.7),
          0 25px 50px rgba(0,0,0,0.5);
      }
    }

    @keyframes softRotate {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    /* Message */
    .message {
      margin-top: 30px;
      color: #ffb6d5;
      font-size: 1.4rem;
      font-weight: 500;
      text-align: center;
      line-height: 1.6;
      opacity: 0;
      animation: messageIn 1.6s 1.2s forwards;
      text-shadow: 0 0 30px rgba(255, 182, 213, 0.8);
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Floating hearts */
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      animation: rise 7s linear infinite;
      opacity: 0;
    }

    @keyframes rise {
      0% {
        transform: translateY(110vh) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.8; }
      90% { opacity: 0.5; }
      100% {
        transform: translateY(-15vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Sparkles around the flower */
    .sparkle {
      position: absolute;
      font-size: 16px;
      animation: sparkle 3s ease-in-out infinite;
      opacity: 0;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- First screen -->
  <div class="container" id="content">
    <div class="bear">🐻</div>
    <h1>Çiçek ister misin aşkım?</h1>
    <div class="buttons">
      <button id="yesBtn">Evet 💕</button>
      <button id="noBtn">Hayır</button>
    </div>
  </div>

  <!-- Reveal screen -->
  <div class="reveal" id="reveal">
    <div class="flower-wrapper">
      <img class="flower-img" src="IMG_1891.png" alt="Pembe çiçek">
      
      <!-- Sparkles -->
      <div class="sparkle" style="top:-10px; left:10%; animation-delay:0.2s">✨</div>
      <div class="sparkle" style="top:20%; right:5%; animation-delay:0.8s">✨</div>
      <div class="sparkle" style="bottom:15%; left:5%; animation-delay:1.4s">✨</div>
      <div class="sparkle" style="bottom:-5px; right:15%; animation-delay:2s">✨</div>
    </div>

    <div class="message">
      Sen benim en güzel<br>
      beyaz çiçeğimsin 💕
    </div>
  </div>

  <!-- Background hearts -->
  <div class="hearts" id="hearts"></div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const content = document.getElementById('content');
    const reveal = document.getElementById('reveal');
    const body = document.body;
    const hearts = document.getElementById('hearts');

    // Create many floating hearts
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.innerHTML = '💕';
      h.style.left = Math.random() * 100 + '%';
      h.style.animationDelay = (Math.random() * 7) + 's';
      h.style.fontSize = (13 + Math.random() * 16) + 'px';
      hearts.appendChild(h);
    }

    // Make "Hayır" run away
    function moveNo() {
      const x = Math.random() * (window.innerWidth - 140);
      const y = Math.random() * (window.innerHeight - 80);
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.position = 'fixed';
    }

    noBtn.addEventListener('mouseover', moveNo);
    noBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      moveNo();
    });

    // Yes button
    yesBtn.addEventListener('click', () => {
      content.classList.add('hide');
      body.classList.add('dark');
      setTimeout(() => {
        reveal.classList.add('visible');
      }, 550);
    });

    window.addEventListener('resize', () => {
      if (noBtn.style.position === 'fixed') moveNo();
    });
  </script>
</body>
</html>
